apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: api-gateway
  namespace: lovable-core

spec:
  replicas: 3

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway

          image: satyamgrao007/lovable-api-gateway:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"

            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://config-service.lovable-core.svc.cluster.local:8888"

            - name: CONFIG_SERVER_URL
              value: "http://config-service.lovable-core.svc.cluster.local:8888"

            - name: SPRING_CLOUD_CONFIG_FAIL_FAST
              value: "false"

            - name: SPRING_CLOUD_CONFIG_RETRY_MAX_ATTEMPTS
              value: "10"

            - name: SPRING_CLOUD_CONFIG_RETRY_INITIAL_INTERVAL
              value: "3000"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET

          resources:
            requests:
              cpu: 80m
              memory: 200Mi

            limits:
              cpu: 250m
              memory: 250Mi

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

  strategy:
    canary:

      stableService: api-gateway-stable

      canaryService: api-gateway-canary

      trafficRouting:
        alb:
          ingress: lovable-main-ingress
          servicePort: 80

      steps:

        # -------------------------------
        # 10% CANARY
        # -------------------------------

        - setWeight: 10

        - pause:
            duration: 30s

        - analysis:
            templates:
              - templateName: api-gateway-error-rate


        # -------------------------------
        # 25% CANARY
        # -------------------------------

        - setWeight: 25

        - pause:
            duration: 30s

        - analysis:
            templates:
              - templateName: api-gateway-error-rate


        # -------------------------------
        # 50% CANARY
        # -------------------------------

        - setWeight: 50

        - pause:
            duration: 30s

        - analysis:
            templates:
              - templateName: api-gateway-error-rate


        # -------------------------------
        # 100% CANARY
        # -------------------------------

        - setWeight: 100