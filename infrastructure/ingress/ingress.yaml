apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: lovable-main-ingress
  namespace: lovable-core

  annotations:

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'

    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-south-1:457724887427:certificate/6359e9c8-b77c-48b8-bcc6-78a15da4921c"

    alb.ingress.kubernetes.io/ssl-redirect: "443"

    external-dns.alpha.kubernetes.io/hostname: "lovable.snapcart.dev,api.snapcart.dev,*.previews.snapcart.dev"

spec:

  ingressClassName: alb

  rules:

    # FRONTEND
    - host: lovable.snapcart.dev

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: lovable-frontend

                port:

                  number: 80


    # API GATEWAY - ROOT/STABLE SERVICE
    - host: api.snapcart.dev

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: api-gateway-stable

                port:

                  name: use-annotation


    # PREVIEW PROXY
    - host: "*.previews.snapcart.dev"

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: lovable-me-proxy

                port:

                  number: 80














