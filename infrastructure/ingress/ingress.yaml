apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: lovable-main-ingress

  namespace: lovable-core

  annotations:

    # ==========================================
    # AWS LOAD BALANCER CONTROLLER
    # ==========================================

    alb.ingress.kubernetes.io/scheme: internet-facing

    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'


    # ==========================================
    # ACM
    # ==========================================

    alb.ingress.kubernetes.io/certificate-arn: "YOUR_ACM_CERTIFICATE_ARN"

    alb.ingress.kubernetes.io/ssl-redirect: "443"


    # ==========================================
    # EXTERNAL DNS
    # ==========================================

    external-dns.alpha.kubernetes.io/hostname: "lovable.snapcart.dev,api.snapcart.dev,*.previews.snapcart.dev"


spec:

  ingressClassName: alb


  rules:

    # ==========================================
    # FRONTEND
    # ==========================================

    - host: lovable.snapcart.dev

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: lovable-frontend

                port:

                  number: 80


    # ==========================================
    # API GATEWAY
    # ==========================================

    - host: api.snapcart.dev

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: api-gateway

                port:

                  name: use-annotation


    # ==========================================
    # PREVIEW PROXY
    # ==========================================

    - host: "*.previews.snapcart.dev"

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: lovable-me-proxy

                port:

                  number: 80















